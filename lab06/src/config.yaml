experiment:
  name: "lab6_fashionmnist_pipeline"
  run_name: "cnn_baseline"
  seed: 42
  output_dir: "./results/lab6"
  mlflow_tracking_uri: "./results/mlruns"

data:
  dataset: "FashionMNIST"
  data_dir: "./data"
  train_size: 55000
  val_size: 5000
  split_seed: 42
  batch_size: 128
  num_workers: 2
  pin_memory: true

model:
  arch: "cnn"           # "cnn" (best Lab 3 model), "mlp", or "attention"
  num_classes: 10

training:
  epochs: 10
  grad_accum_steps: 1   # Set to 4 with batch_size=64 to emulate batch 256
  optimizer: "adam"     # "sgd" or "adam"
  lr: 0.001
  momentum: 0.9         # Used when optimizer == "sgd"
  weight_decay: 0.0
  scheduler: "cosine"
  step_size: 4
  gamma: 0.5
  plateau_patience: 2
  plateau_factor: 0.5

checkpointing:
  save_every_epochs: 1
  resume_from: null
  stop_after_epoch: null